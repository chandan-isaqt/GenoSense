<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2335D6C7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2 15c6.667-6 13.333 0 20-6'/><path d='M9 22c1.798-1.998 2.518-3.995 2.807-5.993'/><path d='M15 2c-1.798 1.998-2.518 3.995-2.807 5.993'/><path d='m17 6-2.5-2.5'/><path d='m14 8-1-1'/><path d='m7 18 2.5 2.5'/><path d='m3.5 14.5.5.5'/><path d='m20 9 .5.5'/><path d='m6.5 12.5 1 1'/><path d='m16.5 10.5 1 1'/><path d='m10 16 1 1'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenoSense — Genomic AI Research Prototype</title>
    <meta name="description" content="GenoSense is an advanced biotechnology, explainable AI, and edge hardware research interface." />
    <!-- Fonts: Inter, Space Grotesk, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('genosense-theme');
          var prefDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'light' || (!saved && !prefDark)) {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-primary)] text-[var(--text-main)] min-h-screen antialiased transition-colors duration-200 selection:bg-[#35D6C7]/20 selection:text-[#35D6C7]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
